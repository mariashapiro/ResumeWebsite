<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <!-- Theme initialization script - prevents flicker -->
    <script>
      (function() {
        const getSystemTheme = () => {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        
        const initTheme = () => {
          const savedTheme = localStorage.getItem('portfolio-theme');
          const theme = savedTheme || getSystemTheme();
          document.documentElement.setAttribute('data-theme', theme);
          return theme;
        };
        
        initTheme();
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    
    <link href="https://fonts.googleapis.com/css?family=Quicksand:300,400,500,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="/css/loading-bar.css"/>
    <script type="text/javascript" src="/js/loading-bar.js"></script>

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root"></div>
    
    <!-- Vite entry point -->
    
    <!-- jQuery and other scripts will be loaded by React after mounting -->
    <!-- This prevents conflicts between React and jQuery -->
    <script>
      // Wait for React to mount before loading jQuery scripts
      window.addEventListener('DOMContentLoaded', function() {
        // Check if React has rendered content
        const checkReactReady = () => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            // React has rendered, now load jQuery scripts
            loadJQueryScripts();
          } else {
            // Try again in 100ms
            setTimeout(checkReactReady, 100);
          }
        };
        
        const loadJQueryScripts = () => {
          const scripts = [
            '/js/jquery.min.js',
            '/js/jquery.easing.1.3.js',
            '/js/bootstrap.min.js',
            '/js/jquery.waypoints.min.js',
            '/js/jquery.flexslider-min.js',
            '/js/owl.carousel.min.js',
            '/js/jquery.countTo.js',
            'https://unpkg.com/sticky-kit@1.1.3/dist/sticky-kit.min.js',
            '/js/main.js'
          ];
          
          let loadedCount = 0;
          
          scripts.forEach((src, index) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => {
              loadedCount++;
              // Initialize main.js functions only after all scripts are loaded
              if (loadedCount === scripts.length && window.jQuery) {
                // Re-run main.js initialization if needed
                console.log('All jQuery scripts loaded successfully');
              }
            };
            script.onerror = () => {
              console.warn('Failed to load script:', src);
            };
            document.head.appendChild(script);
          });
        };
        
        checkReactReady();
      });
    </script>
  </body>
</html>
