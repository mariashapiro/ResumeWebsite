<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <!-- Theme initialization script - prevents flicker -->
    <script>
      (function() {
        const getSystemTheme = () => {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        
        const initTheme = () => {
          const savedTheme = localStorage.getItem('portfolio-theme');
          const theme = savedTheme || getSystemTheme();
          document.documentElement.setAttribute('data-theme', theme);
          return theme;
        };
        
        initTheme();
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    
    <link href="https://fonts.googleapis.com/css?family=Quicksand:300,400,500,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="/css/loading-bar.css"/>
    <script type="text/javascript" src="/js/loading-bar.js"></script>

    <!-- Animate.css -->
    <link rel="stylesheet" href="/css/animate.css">
    <!-- Icomoon Icon Fonts-->
    <link rel="stylesheet" href="/css/icomoon.css">
    <!-- Bootstrap  -->
    <link rel="stylesheet" href="/css/bootstrap.css">
    <!-- Flexslider  -->
    <link rel="stylesheet" href="/css/flexslider.css">
    <!-- Owl Carousel -->
    <link rel="stylesheet" href="/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/css/owl.theme.default.min.css">
    <!-- Theme style  -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Dark theme variables -->
    <link rel="stylesheet" href="/css/dark-theme.css">

    <!-- Modernizr JS -->
    <script src="/js/modernizr-2.6.2.min.js"></script>
    
    <title>Maria Shapiro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root"></div>
    
    <!-- Vite entry point -->
    <script type="module" src="/src/index.jsx"></script>
    
    <!-- jQuery must be loaded before other scripts that depend on it -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery.easing.1.3.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.waypoints.min.js"></script>
    <script src="/js/jquery.flexslider-min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/jquery.countTo.js"></script>
    <script src="https://unpkg.com/sticky-kit@1.1.3/dist/sticky-kit.min.js"></script>
    
    <!-- Main JS initialization script -->
    <script>
      // Wait for React to mount and DOM to be ready before initializing jQuery functionality
      window.addEventListener('DOMContentLoaded', function() {
        // Check if React has rendered content and jQuery is available
        const initializeWhenReady = () => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0 && window.jQuery) {
            // React has rendered and jQuery is available, now load main.js
            const mainScript = document.createElement('script');
            mainScript.src = '/js/main.js';
            mainScript.onload = () => {
              console.log('Main.js loaded and initialized');
            };
            mainScript.onerror = () => {
              console.warn('Failed to load main.js');
            };
            document.head.appendChild(mainScript);
          } else {
            // Try again in 100ms
            setTimeout(initializeWhenReady, 100);
          }
        };
        
        // Small delay to ensure all scripts are loaded
        setTimeout(initializeWhenReady, 200);
      });
    </script>
  </body>
</html>
